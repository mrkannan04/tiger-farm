<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tiger Farm — Mobile & Tablet Responsive Device Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #142318;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .header-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
      width: 100%;
    }
    .btn-device {
      padding: 7px 14px;
      background: #2D6A4F;
      color: #fff;
      border: 1.5px solid #52B788;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-device:hover {
      background: #3e8263;
    }
    .btn-device.active {
      background: #52B788;
      color: #142318;
      font-weight: 700;
    }
    .btn-direct-app {
      background: #D4A017;
      border-color: #FBBF24;
      color: #1A1A1A;
      font-weight: 700;
    }
    .btn-direct-app:hover {
      background: #E5B228;
    }
    .frame-wrapper {
      position: relative;
      background: #111;
      border-radius: 36px;
      padding: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 4px solid #2D6A4F;
      transition: all 0.3s ease;
      max-width: 100%;
      overflow: hidden;
    }
    iframe {
      border: none;
      border-radius: 24px;
      background: #fff;
      display: block;
      max-width: 100%;
    }

    @media (max-width: 768px) {
      body {
        padding: 8px;
      }
      .frame-wrapper {
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 16px;
        padding: 4px;
        border-width: 2px;
      }
      iframe {
        width: 100% !important;
        height: 78vh !important;
        border-radius: 12px;
      }
    }
</head>
<body>
  <div class="header-bar">
    <h3 style="margin: 0 10px 0 0;">🐯 Responsive Preview</h3>
    <button class="btn-device active" id="btnPhone" onclick="setDevice(390, 844, this)">📱 iPhone (390×844)</button>
    <button class="btn-device" id="btnSE" onclick="setDevice(375, 667, this)">📱 Small Mobile (375×667)</button>
    <button class="btn-device" id="btnTablet" onclick="setDevice(768, 800, this)">📟 Tablet (768×800)</button>
    <span style="border-left: 1px solid #52B788; height: 24px; margin: 0 6px;"></span>
    <button class="btn-device" onclick="setPage('dashboard')">📊 Dashboard</button>
    <button class="btn-device" onclick="setPage('products')">📦 Products</button>
    <button class="btn-device" onclick="setPage('notifications')">🔔 Alerts</button>
    <button class="btn-device" onclick="setPage('reports')">📑 Reports</button>
    <button class="btn-device" onclick="setPage('settings')">⚙️ Settings</button>
    <button class="btn-device" onclick="openHub()">📱 Open Mobile Hub</button>
    <a href="/app" class="btn-device btn-direct-app" title="Launch Fullscreen Mobile App">🚀 Direct App (/app)</a>
  </div>
  <div class="frame-wrapper" id="frameWrap">
    <iframe id="previewFrame" src="/app#dashboard" width="390" height="844"></iframe>
  </div>

  <script>
    function setDevice(w, h, btn) {
      const frame = document.getElementById('previewFrame');
      if (window.innerWidth <= 768) {
        frame.style.width = '100%';
        frame.style.height = '80vh';
      } else {
        frame.style.width = w + 'px';
        frame.style.height = h + 'px';
      }
      frame.width = w;
      frame.height = h;
      document.querySelectorAll('#btnPhone, #btnSE, #btnTablet').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
    function setPage(view) {
      const frame = document.getElementById('previewFrame');
      frame.contentWindow.location.hash = '#' + view;
    }
    function openHub() {
      const frame = document.getElementById('previewFrame');
      if (frame && frame.contentWindow && frame.contentWindow.App) {
        frame.contentWindow.App.openModal('modalMobileMenu');
      }
    }

    // Auto-detect mobile screen on load
    if (window.innerWidth <= 768) {
      const frame = document.getElementById('previewFrame');
      frame.style.width = '100%';
      frame.style.height = '80vh';
    }
  </script>
</body>
</html>
